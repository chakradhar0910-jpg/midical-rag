version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medrag_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicalrag}
      POSTGRES_USER: ${POSTGRES_USER:-medrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medrag_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medrag} -d ${POSTGRES_DB:-medicalrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - medrag_net

  redis:
    image: redis:7-alpine
    container_name: medrag_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - medrag_net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: medrag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "exit(!IO::Socket::INET->new('127.0.0.1:6333'))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - medrag_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrag_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medrag}:${POSTGRES_PASSWORD:-medrag_pass}@postgres:5432/${POSTGRES_DB:-medicalrag}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost,http://frontend:3000}
      SECRET_KEY: ${SECRET_KEY:-medicalrag-secret-key-change-in-production-minimum-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medicalrag.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_TIMEOUT_SECONDS: "30"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: "120"
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      APP_NAME: MedicalRAG
      DEBUG: "false"
      LOG_LEVEL: INFO
      MAX_UPLOAD_SIZE_MB: "50"
      ALLOWED_EXTENSIONS: "pdf,docx,txt,csv,md"
      BCRYPT_ROUNDS: "12"
      MAX_LOGIN_ATTEMPTS: "5"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      PROMETHEUS_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@medicalrag.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - medrag_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medrag_frontend
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000 2>/dev/null | head -1 || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - medrag_net

  nginx:
    image: nginx:alpine
    container_name: medrag_nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - medrag_net

  prometheus:
    image: prom/prometheus:latest
    container_name: medrag_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - medrag_net

  grafana:
    image: grafana/grafana:latest
    container_name: medrag_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Admin@123456}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - medrag_net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  medrag_net:
    driver: bridge
